# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: ">=1.27.1"
    extensions:
        azure.ai.agents: ">=1.0.0-beta.9"
name: document-agent
services:
    document-agent:
        project: src/document-agent
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        codeConfiguration:
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        env:
            FOUNDRY_PROJECT_ENDPOINT: ${FOUNDRY_PROJECT_ENDPOINT}
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL}
            AI_GATEWAY_AUDIENCE: ${AI_GATEWAY_AUDIENCE}
            AI_GATEWAY_API_VERSION: ${AI_GATEWAY_API_VERSION}
            AZURE_CONTENT_UNDERSTANDING_ENDPOINT: ${AZURE_CONTENT_UNDERSTANDING_ENDPOINT}
        description: >-
            Document Agent - erstellt eine Firmenanalyse (Kreditwürdigkeit) aus im Chat
            angehängten Finanzdokumenten. OCR via Azure AI Document Intelligence,
            Analyse via Foundry-Modell.
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Credit Assessment
                - Content Understanding
                - Responses Protocol
                - Streaming
        name: document-agent
        protocols:
            - protocol: responses
              version: 2.0.0
    # The spoke VNet, Container Apps environment, Application Gateway, the
    # spoke's own network-injected Foundry account/project and its agent
    # data plane (Storage/Cosmos DB/AI Search) are owned by the
    # ai-spoke-template repository, deployed by the AI Platform Team.
    # Source-code deployment needs no agent-specific ACR. The existing
    # spoke project endpoint below is supplied through the azd environment.
    ai-project:
        host: azure.ai.project
        endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
